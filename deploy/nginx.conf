# ============================================================
# 智能文档填充 - Nginx 站点配置
# 放到 /etc/nginx/sites-available/autofill，再软链到 sites-enabled
#
# 关键点：
#   1) 必须透传 Host（默认行为），设置页按 Host 判断是否本机访问
#   2) client_max_body_size 要大于 50MB（应用允许的上传上限）
#   3) AI 分析可能较慢，proxy_read_timeout 放宽到 180s
# ============================================================

server {
    listen 80;
    listen [::]:80;
    # 你的域名（www 也写上，certbot 会一起签发；没有域名就写服务器公网 IP，或改成 `_`）
    server_name magicbus.asia www.magicbus.asia;

    # 上传文件上限（应用限制 50MB）
    client_max_body_size 60m;

    # 可选：整站加一层访问控制（知识库在浏览器，但服务本身谁都能用）
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 透传 Host —— 设置页依赖它判断本机/远程，务必保留
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 分析耗时较长
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # 大文件上传时不要缓冲到磁盘再转发（可选，稳妥起见保留默认也行）
        proxy_request_buffering off;
    }

    # 健康检查
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    # 静态资源：不缓存，靠 ETag/Last-Modified 协商（304 很便宜）
    # 之前用 expires 7d 会导致更新 CSS 后用户仍看到旧样式，这里改为每次校验
    location /assets/ {
        proxy_pass http://127.0.0.1:3000/assets/;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }
}
